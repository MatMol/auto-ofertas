name: Scrape MercadoLibre (disabled — runs from Windows PC)

# ML scraping runs from a residential IP via Windows Task Scheduler.
# This workflow is kept for reference / manual testing only.
on:
  workflow_dispatch: {}

concurrency:
  group: autoofertas-ingestion
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MercadoLibre scraper
        run: pnpm scrape:ml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          USD_RATE: ${{ vars.USD_RATE }}
          USD_RATE_DATE: ${{ vars.USD_RATE_DATE }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
